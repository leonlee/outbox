name: Publish Javadoc

# The site documents the latest release, so rebuild when one is tagged.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout latest release tag
        run: |
          LATEST_TAG=$(git tag --list 'v*' --sort=-version:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            echo "No release tags found, building from HEAD"
          else
            echo "Building Javadoc from tag: $LATEST_TAG"
            git checkout "$LATEST_TAG"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Generate Javadoc
        # Library API only: leave out the benchmarks and samples modules.
        run: mvn -B javadoc:aggregate -DexcludePackageNames='io.outbox.benchmark:io.outbox.benchmark.*:io.outbox.demo:io.outbox.demo.*'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/reports/apidocs

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
